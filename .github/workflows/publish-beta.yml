name: SEO-TidY Publish Beta

on:
  push:
    tags:
      - 'v*.*.*-beta.*'

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish beta
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify beta version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Invalid beta tag"
            exit 1
          fi

          export VERSION

          node -e "
            const fs = require('fs');
            const v = process.env.VERSION;
            const pkg = require('./package.json');
            const lock = require('./package-lock.json');
            const php = fs.readFileSync('seo-tidy.php', 'utf8');
            if (pkg.version !== v || lock.version !== v ||
                !php.includes('Version: ' + v) ||
                !php.includes(\"define('SEO_TIDY_VERSION', '\" + v + \"')\")) {
              process.exit(1);
            }
          "

          echo "Version verified: $VERSION"

      - name: Ensure release does not exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate translations
        run: npm run check:i18n

      - name: Build interfaces
        run: npm run build

      - name: Build portable WordPress ZIP
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Prepare checksums
        shell: bash
        run: |
          cd dist
          sha256sum seo-tidy-*.zip > SHA256SUMS.txt

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            dist/seo-tidy-*.zip \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "SEO-TidY $RELEASE_TAG" \
            --notes "Automated SEO-TidY beta release.

          Free and open-source WordPress SEO and AI-search readiness tools.
          English and Latvian interface support.

          This is a pre-release for testing.
          Back up your WordPress website before installation.

          Requirements: WordPress 6.8+, PHP 8.1+.

          Clean WordPress ZIP installation is not yet independently verified.

          Issues: https://github.com/QvarcY/wordpress-seo-tidy/issues
          Support: https://buymeacoffee.com/craftin"