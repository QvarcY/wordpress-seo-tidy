name: SEO-TidY Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-tidy-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: WordPress 6.8 / PHP 8.2 / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none

      - name: Install dependencies
        run: npm ci

      - name: Validate PHP syntax
        run: |
          php -l seo-tidy.php
          find includes tests/integration -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Build WordPress interfaces
        run: npm run build

      - name: Validate integration runner
        run: node --check tests/integration/run.cjs

      - name: Start WordPress
        run: npm exec --no -- wp-env start

      - name: Run integration tests
        env:
          SEO_TIDY_DNS_BOOTSTRAP: ''
          SEO_TIDY_BASE_URL: http://localhost:8898
        run: npm run test:integration

      - name: Stop WordPress
        if: always()
        run: npm exec --no -- wp-env stop
